name: Build LuCI Only

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: openwrt_24_ipk
            label: OpenWrt 24.10 IPK
          - id: openwrt_25_apk
            label: OpenWrt 25.12 APK

    steps:
      - name: Install dependencies
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget curl
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source

      - name: Import SDK environment
        id: sdk_env
        run: |
          # 动态读取对应的 env 文件
          source_file="source/.github/workflows/${{ matrix.id }}.env"
          cat "$source_file" >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do
            echo "${key,,}=${value}" >> "$GITHUB_OUTPUT"
          done < "$source_file"

      - name: Initialize SDK
        env:
          SDK_FILE: ${{ steps.sdk_env.outputs.sdk_name }}.${{ steps.sdk_env.outputs.sdk_ext }}
          SDK_SOURCE: ${{ steps.sdk_env.outputs.sdk_url }}${{ steps.sdk_env.outputs.sdk_name }}.${{ steps.sdk_env.outputs.sdk_ext }}
        run: |
          wget -q "$SDK_SOURCE"
          mkdir -p sdk
          if [ "${SDK_EXT}" = "tar.zst" ]; then
            tar --zstd -xf "$SDK_FILE" -C sdk --strip-components=1
          else
            tar -xf "$SDK_FILE" -C sdk --strip-components=1
          fi

          cd sdk
          cat <<EOF > feeds.conf
          src-git base https://github.com/openwrt/openwrt.git;${FEED_BRANCH}
          src-git packages https://github.com/openwrt/packages.git;${FEED_BRANCH}
          src-git luci https://github.com/openwrt/luci.git;${FEED_BRANCH}
          src-git routing https://git.openwrt.org/feed/routing.git;${FEED_BRANCH}
          src-link djonehub $(pwd)/../source
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 只配置 luci-app-djonehub，不配置核心
          cat <<'EOF' > .config
          CONFIG_PACKAGE_luci-app-djonehub=m
          EOF
          make defconfig

      - name: Compile LuCI App
        run: |
          cd sdk
          ./scripts/feeds update djonehub
          ./scripts/feeds install -a -p djonehub
          
          # 只编译 luci-app-djonehub
          make package/feeds/djonehub/luci-app-djonehub/compile V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-djonehub-${{ matrix.id }}
          path: sdk/bin/packages/*/djonehub/luci-app-djonehub_*.${{ steps.sdk_env.outputs.package_ext }}
  # ... 上面的 Build 部分保持不变 ...

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
