name: Release Packages

on:
  workflow_dispatch:
    inputs:
      djonehub_version:
        description: DJOneHub release tag
        required: true
        default: v1.5.2
  push:
    tags:
      - 'v*'

env:
  TZ: Asia/Shanghai
  DJONEHUB_VERSION: ${{ github.event.inputs.djonehub_version || 'v1.5.2' }}

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
      luci_version: ${{ steps.release_meta.outputs.luci_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve versions
        id: release_meta
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_name="${GITHUB_REF_NAME}"
            luci_version="${GITHUB_REF_NAME#v}"
          else
            tag_name="v0.0.0-dev"
            luci_version="0.0.0-dev"
          fi

          previous_tag="$(git tag --sort=-v:refname --merged HEAD | grep -v "^${tag_name}$" | head -n 1 || true)"

          {
            echo "## DJOneHub LuCI ${luci_version}"
            echo
            echo "### 更新日志"
            echo
            if [ -n "$previous_tag" ]; then
              git log --pretty=format:'- %s (%h)' "${previous_tag}..HEAD"
            else
              git log --pretty=format:'- %s (%h)' -n 20
            fi
            echo
            echo
            echo "### 安装包说明"
            echo
            echo "- luci-app-djonehub: LuCI 管理页面，不包含 DJOneHub core。安装后可在页面下载/安装核心。"
            echo "- djonehub-core-arm64: 仅包含 djonehub_${DJONEHUB_VERSION}_linux_arm64 core。"
            echo "- djonehub-core-amd64: 仅包含 djonehub_${DJONEHUB_VERSION}_linux_amd64 core。"
            echo "- djonehub-core-armv7: 仅包含 djonehub_${DJONEHUB_VERSION}_linux_armv7 core。"
            echo
            echo "### 包格式"
            echo
            echo "- OpenWrt 24.10 SDK: .ipk"
            echo "- OpenWrt 25.12 SDK: .apk"
            echo
            echo "### 架构选择"
            echo
            echo "- aarch64 / arm64 路由器选择 arm64"
            echo "- x86_64 / amd64 设备选择 amd64"
            echo "- armv7l / armv7 设备选择 armv7"
            echo
            if [ -n "$previous_tag" ]; then
              echo "完整对比: https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${tag_name}"
            fi
          } > release-notes.md

          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "luci_version=${luci_version}" >> "$GITHUB_OUTPUT"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: openwrt_24_ipk
            label: OpenWrt 24.10 IPK
          - id: openwrt_25_apk
            label: OpenWrt 25.12 APK
            # apk 为可选项：25.x 的 APK 构建比 24.10 更严格，失败不影响 ipk 发布
            continue-on-error: true

    steps:
      - name: Install packages
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install zstd build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget curl
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source

      - name: Import SDK environment
        id: sdk_env
        run: |
          cat "source/.github/workflows/${{ matrix.id }}.env" >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do
            echo "${key,,}=${value}" >> "$GITHUB_OUTPUT"
          done < "source/.github/workflows/${{ matrix.id }}.env"

      - name: Prepare DJOneHub core files
        run: |
          set -eu
          mkdir -p source/djonehub-core/files
          for arch in arm64 amd64 armv7; do
            asset="djonehub_${DJONEHUB_VERSION}_linux_${arch}"
            url="https://github.com/563617356/djonehub-release/releases/download/${DJONEHUB_VERSION}/${asset}"
            curl -fL --connect-timeout 20 --retry 3 "$url" -o "source/djonehub-core/files/djonehub-${arch}"
            chmod 0755 "source/djonehub-core/files/djonehub-${arch}"
            file "source/djonehub-core/files/djonehub-${arch}"
          done

      - name: Initialize SDK
        env:
          SDK_FILE: ${{ steps.sdk_env.outputs.sdk_name }}.${{ steps.sdk_env.outputs.sdk_ext }}
          SDK_SOURCE: ${{ steps.sdk_env.outputs.sdk_url }}${{ steps.sdk_env.outputs.sdk_name }}.${{ steps.sdk_env.outputs.sdk_ext }}
        run: |
          set -eu
          wget "$SDK_SOURCE"
          mkdir -p sdk
          if [ "${SDK_EXT}" = "tar.zst" ]; then
            tar --zstd -xf "$SDK_FILE" -C sdk --strip-components=1
          else
            tar -xf "$SDK_FILE" -C sdk --strip-components=1
          fi

          cd sdk
          cat <<EOF > feeds.conf
          src-git base https://github.com/openwrt/openwrt.git;${FEED_BRANCH}
          src-git packages https://github.com/openwrt/packages.git;${FEED_BRANCH}
          src-git luci https://github.com/openwrt/luci.git;${FEED_BRANCH}
          src-git routing https://git.openwrt.org/feed/routing.git;${FEED_BRANCH}
          src-link djonehub $(pwd)/../source
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -a -p djonehub

          cat <<'EOF' > .config
          CONFIG_ALL_NONSHARED=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL=n
          CONFIG_AUTOREMOVE=n
          CONFIG_PACKAGE_luci-app-djonehub=m
          CONFIG_PACKAGE_djonehub-core-arm64=m
          CONFIG_PACKAGE_djonehub-core-amd64=m
          CONFIG_PACKAGE_djonehub-core-armv7=m
          EOF
          make defconfig
          make clean

      - name: Compile packages
        run: |
          set -eu
          cd sdk
          ./scripts/feeds update djonehub
          ./scripts/feeds install -a -p djonehub

          : > /tmp/compile.log
          for pkg in luci-app-djonehub djonehub-core; do
            make "package/feeds/djonehub/${pkg}/clean" || true
            if ! make "package/feeds/djonehub/${pkg}/compile" -j"$(nproc)" 2>&1 | tee -a /tmp/compile.log; then
              make "package/feeds/djonehub/${pkg}/compile" -j1 V=s 2>&1 | tee -a /tmp/compile.log || true
            fi
          done

          package_dir="$(pwd)/bin/packages/${SDK_ARCH}/djonehub"
          dist_dir="$(pwd)/../dist/${{ matrix.id }}"
          mkdir -p "$dist_dir"

          shopt -s nullglob
          package_files=("$package_dir"/*.${PACKAGE_EXT})
          if [ ${#package_files[@]} -eq 0 ]; then
            # 不再直接 exit 1：改为告警，避免 apk 失败阻塞整个发布流程
            echo "::warning::No .${PACKAGE_EXT} packages were produced in ${package_dir}"
          else
            cp "$package_dir"/*.${PACKAGE_EXT} "$dist_dir"/
          fi
          cp "$package_dir"/Packages* "$dist_dir"/ 2>/dev/null || true
          cp "$package_dir"/APKINDEX* "$dist_dir"/ 2>/dev/null || true

          {
            echo "Tag: ${{ needs.prepare.outputs.tag_name }}"
            echo "LuCI version: ${{ needs.prepare.outputs.luci_version }}"
            echo "DJOneHub core: ${DJONEHUB_VERSION}"
            echo "Build: ${{ matrix.label }}"
            echo "Build ID: ${{ matrix.id }}"
            echo "SDK: ${SDK_NAME}"
            echo "Package format: ${PACKAGE_EXT}"
            echo "Package count: ${#package_files[@]}"
          } > "$dist_dir/BUILD-INFO.txt"

      - name: Record APK build status
        if: always()
        run: |
          set -eu
          dist_dir="dist/${{ matrix.id }}"
          mkdir -p "$dist_dir"
          shopt -s nullglob
          apks=("$dist_dir"/*.apk)
          if [ "${{ matrix.id }}" = "openwrt_25_apk" ] && [ ${#apks[@]} -eq 0 ]; then
            {
              echo "APK 构建未产出 .apk 包（OpenWrt 25.12 分支）。"
              echo ""
              echo "**常见原因**：25.x 的 APK 构建比 24.10 更严格（luci.mk / 包签名 / conffiles / 符号链接等），"
              echo "或 DJOneHub core 下载失败、SDK 下载/解压失败。"
              echo ""
              echo "**末尾 80 行编译日志：**"
              echo '```'
              tail -n 80 /tmp/compile.log 2>/dev/null || true
              echo '```'
              echo ""
              echo "完整日志请查看本次 workflow run 的 \`Build OpenWrt 25.12 APK\` 任务。"
            } > "$dist_dir/APK_FAILURE.md"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: djonehub-${{ matrix.id }}
          path: dist/${{ matrix.id }}
          retention-days: 7

  release:
    name: Publish Release
    needs:
      - prepare
      - build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: djonehub-*
          merge-multiple: false

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes

      - name: Collect release assets
        run: |
          set -eu
          mkdir -p releases
          shopt -s nullglob
          : > releases/_apk_failure.md
          for dir in artifacts/*; do
            [ -d "$dir" ] || continue
            for package in "$dir"/*.ipk "$dir"/*.apk; do
              [ -f "$package" ] || continue
              cp "$package" releases/
            done
            [ -f "$dir/BUILD-INFO.txt" ] && cp "$dir/BUILD-INFO.txt" "releases/$(basename "$dir")-BUILD-INFO.txt"
            [ -f "$dir/APK_FAILURE.md" ] && cat "$dir/APK_FAILURE.md" >> releases/_apk_failure.md
          done

          (cd releases && sha256sum *.ipk *.apk 2>/dev/null > sha256sums.txt || true)
          ls -lh releases

      - name: Build final release notes
        run: |
          set -eu
          cat release-notes/release-notes.md > final-notes.md
          if [ -s releases/_apk_failure.md ]; then
            {
              echo ""
              echo "## ⚠️ APK 构建状态"
              echo ""
              echo "本次发布**未包含** OpenWrt 25.12 (apk) 包。原因如下："
              echo ""
              cat releases/_apk_failure.md
            } >> final-notes.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          body_path: final-notes.md
          files: releases/*
